name: CI

on:
  push:
    branches: [main, feat/ai-operating-layer]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # Regenerate the lockfile from package.json so CI stays valid when dependency ranges change.
      - run: npm install --package-lock-only --ignore-scripts
      - run: npm ci

      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Organization role validation tests
        run: npm run test:organization-roles

      - name: Mission dossier persistence tests
        run: npm run test:mission-dossiers

      - name: Web discovery identity tests
        run: npm run test:web-discovery

      - name: Discovery workflow lifecycle tests
        run: npm run test:discovery-enqueue

      - name: Qualification contract tests
        run: npm run test:qualification

      - name: AI operating layer provider provenance tests
        run: npm run test:operating-layer

      - name: Production build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder

      - name: Start production server
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
        run: |
          nohup npm start -- -p 3000 > /tmp/ai-distribution-platform.log 2>&1 &
          echo $! > /tmp/ai-distribution-platform.pid
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/ai-distribution-platform.log
          exit 1

      - name: Smoke test
        run: npm run smoke
        env:
          BASE_URL: http://127.0.0.1:3000

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Playwright E2E
        run: npm run test:e2e
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
          NEXT_PUBLIC_SUPABASE_OAUTH_PROVIDERS: google
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}

      - name: Stop production server
        if: always()
        run: |
          if [ -f /tmp/ai-distribution-platform.pid ]; then
            kill "$(cat /tmp/ai-distribution-platform.pid)" || true
          fi

